<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Tu workshop de modernización con IBM Bob: Java 8 a Java 21 y de JSF o Struts a React. Sigue los laboratorios, compara resultados y guarda tus conclusiones." />
    <title>Bobathon BCN 2026 · Retos del workshop</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=bob" />
    <link rel="alternate icon" href="./favicon.ico?v=bob" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      try {
        const preference = JSON.parse(localStorage.getItem('bobathon-bcn-2026:workshop:v1') || '{}').theme || 'system';
        document.documentElement.dataset.theme = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div id="app"><main class="initial-loading" aria-live="polite">Preparando tu workshop…</main></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="search-dialog" aria-labelledby="search-title"></dialog>
    <dialog id="diagram-dialog" aria-labelledby="diagram-title"></dialog>
    <dialog id="notes-dialog" aria-labelledby="notes-title"></dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
